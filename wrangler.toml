name = "kurator"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Retains console output and exceptions in Workers Logs. Without this the
# Worker's logs go nowhere: `wrangler tail` is live-only and cannot span the
# days between fortnightly fires, which is why a scheduling bug went unseen
# for three months.
[observability]
enabled = true

[triggers]
# Wakes the Worker daily at 14:00 AND 15:00 UTC. The schedule config in
# src/digest.ts is the source of truth: it posts only at 15:00 Europe/London
# (3pm UK) on the right fortnight, so at most one wake-up per fortnight posts,
# and the time stays correct across BST/GMT:
#   - Summer (BST, UTC+1): 14:00 UTC = 15:00 London  -> posts
#   - Winter (GMT, UTC+0): 15:00 UTC = 15:00 London  -> posts
# Deliberately NOT pinned to a weekday: with "* * 5" Cloudflare fired these on
# Thursdays, one day off the intended Friday, so shouldPostDigest returned
# "off-day" on every single fire and no digest posted between Jun and Sep 2026.
# Waking daily and letting src/digest.ts decide removes that dependency; the
# extra wake-ups cost one early return each and make no Slack calls.
# Cron is always UTC. If you change POST_HOUR / TIME_ZONE in src/digest.ts,
# update the hours here to the matching UTC hour(s).
crons = ["0 14 * * *", "0 15 * * *"]
